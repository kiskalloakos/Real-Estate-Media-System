<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Nova Tiles symbol</title>
  <desc id="desc">Four curved geometric tiles rotate around a sharp central star.</desc>
  <defs>
    <path id="nova-tile" d="M14 28C28 14 46 8 60 10C48 26 46 42 58 58C42 46 26 48 10 60C8 46 10 34 14 28Z"/>
    <mask id="nova-star-cut">
      <rect width="128" height="128" fill="white"/>
      <path fill="black" d="M64 36C62 52 56 62 36 64C56 66 62 76 64 92C66 76 72 66 92 64C72 62 66 52 64 36Z"/>
    </mask>
  </defs>
  <g fill="#10100E" mask="url(#nova-star-cut)">
    <use href="#nova-tile"/>
    <use href="#nova-tile" transform="rotate(90 64 64)"/>
    <use href="#nova-tile" transform="rotate(180 64 64)"/>
    <use href="#nova-tile" transform="rotate(270 64 64)"/>
  </g>
</svg>
