<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Realty Media icon concepts</title>
  <desc id="desc">A comparison of the Open Frame and RM Fold icon directions.</desc>
  <rect width="1440" height="900" fill="#F5EFE4"/>

  <text x="92" y="92" fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">REALTY MEDIA</text>
  <text x="92" y="146" fill="#10100E" font-family="Georgia, serif" font-size="42">Simple icon exploration</text>
  <line x1="92" y1="185" x2="1348" y2="185" stroke="#B7A58D" stroke-width="1"/>

  <g transform="translate(92 244)">
    <text x="0" y="0" fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">01 — OPEN FRAME</text>
    <text x="0" y="36" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="18">Property + framing + focus</text>

    <rect x="0" y="76" width="420" height="420" rx="84" fill="#0D241C"/>
    <g transform="translate(114 190) scale(1.5)">
      <path d="M58 20H20V58" fill="none" stroke="#F5EFE4" stroke-width="14"/>
      <path d="M70 108H108V70" fill="none" stroke="#F5EFE4" stroke-width="14"/>
      <circle cx="64" cy="64" r="9" fill="#D9AD52"/>
    </g>

    <g transform="translate(0 550)">
      <g transform="scale(.55)">
        <path d="M58 20H20V58" fill="none" stroke="#10100E" stroke-width="14"/>
        <path d="M70 108H108V70" fill="none" stroke="#10100E" stroke-width="14"/>
        <circle cx="64" cy="64" r="9" fill="#10100E"/>
      </g>
      <text x="98" y="43" fill="#10100E" font-family="Georgia, serif" font-size="32">Realty Media</text>
    </g>

    <g transform="translate(0 660)">
      <rect width="32" height="32" rx="7" fill="#0D241C"/>
      <g transform="scale(.25)">
        <path d="M58 20H20V58" fill="none" stroke="#F5EFE4" stroke-width="14"/>
        <path d="M70 108H108V70" fill="none" stroke="#F5EFE4" stroke-width="14"/>
        <circle cx="64" cy="64" r="9" fill="#D9AD52"/>
      </g>
      <text x="52" y="23" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="16">32 px favicon check</text>
    </g>
  </g>

  <line x1="720" y1="244" x2="720" y2="816" stroke="#B7A58D" stroke-width="1"/>

  <g transform="translate(812 244)">
    <text x="0" y="0" fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">04 — RM FOLD</text>
    <text x="0" y="36" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="18">A single line folding from R into M</text>

    <rect x="0" y="76" width="420" height="420" rx="84" fill="#0D241C"/>
    <g transform="translate(114 190) scale(1.5)">
      <path d="M24 106V24H56C76 24 86 33 86 49C86 65 76 74 57 74H24L57 74L80 106L103 74V106"
            fill="none" stroke="#F5EFE4" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>

    <g transform="translate(0 550)">
      <g transform="scale(.55)">
        <path d="M24 106V24H56C76 24 86 33 86 49C86 65 76 74 57 74H24L57 74L80 106L103 74V106"
              fill="none" stroke="#10100E" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
      </g>
      <text x="98" y="43" fill="#10100E" font-family="Georgia, serif" font-size="32">Realty Media</text>
    </g>

    <g transform="translate(0 660)">
      <rect width="32" height="32" rx="7" fill="#0D241C"/>
      <g transform="scale(.25)">
        <path d="M24 106V24H56C76 24 86 33 86 49C86 65 76 74 57 74H24L57 74L80 106L103 74V106"
              fill="none" stroke="#F5EFE4" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
      </g>
      <text x="52" y="23" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="16">32 px favicon check</text>
    </g>
  </g>
</svg>
