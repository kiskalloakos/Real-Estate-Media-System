<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Realty Media symbol exploration, round three</title>
  <desc id="desc">Three pillars, portal, and offset squares logo marks shown large, inverse, and at favicon size.</desc>
  <rect width="1500" height="760" fill="#F5EFE4"/>
  <text x="72" y="68" fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">REALTY MEDIA — SYMBOL STUDY 03</text>
  <line x1="72" y1="98" x2="1428" y2="98" stroke="#CFC2AE"/>

  <line x1="500" y1="140" x2="500" y2="680" stroke="#CFC2AE"/>
  <line x1="1000" y1="140" x2="1000" y2="680" stroke="#CFC2AE"/>

  <g transform="translate(72 150)">
