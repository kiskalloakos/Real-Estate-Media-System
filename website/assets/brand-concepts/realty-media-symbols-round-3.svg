    <g transform="translate(64 76) scale(2.25)">
      <path d="M18 116V61C18 31 38 14 64 14C90 14 110 31 110 61V116" fill="none" stroke="#10100E" stroke-width="24" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 420)">
      <rect width="88" height="88" fill="#10100E"/>
      <g transform="translate(12 12) scale(.5)">
        <path d="M18 116V61C18 31 38 14 64 14C90 14 110 31 110 61V116" fill="none" stroke="#F5EFE4" stroke-width="24" stroke-linejoin="round"/>
      </g>
