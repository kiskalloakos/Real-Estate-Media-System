<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Realty Media orbit star and play button studies</title>
  <desc id="desc">Three flat integrations of a play symbol into the selected orbit star.</desc>
  <defs>
    <g id="orbit-crescents" fill="currentColor">
      <path d="M58 28C24 28 4 42 4 64C4 86 24 100 58 100C32 91 18 78 18 64C18 50 32 37 58 28Z"/>
      <path d="M70 28C104 28 124 42 124 64C124 86 104 100 70 100C96 91 110 78 110 64C110 50 96 37 70 28Z"/>
    </g>
    <g id="play-hybrid" fill="currentColor">
      <use href="#orbit-crescents"/>
      <path d="M64 14C62 42 54 59 22 64C54 69 62 86 64 114C66 87 70 78 77 72L110 64L77 56C70 50 66 41 64 14Z"/>
    </g>

    <mask id="sheet-star-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <path fill="black" d="M61 39C60 54 55 62 40 64C55 66 60 74 61 89C62 74 67 66 82 64C67 62 62 54 61 39Z"/>
    </mask>
    <g id="star-cut-play" fill="currentColor">
      <use href="#orbit-crescents"/>
      <path d="M38 29L112 64L38 99Z" mask="url(#sheet-star-cut)"/>
    </g>

    <mask id="sheet-play-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <path fill="black" d="M54 50L80 64L54 78Z"/>
    </mask>
    <g id="play-cut-star" fill="currentColor">
      <use href="#orbit-crescents"/>
      <path d="M64 14C62 42 54 59 22 64C54 69 62 86 64 114C66 86 74 69 106 64C74 59 66 42 64 14Z" mask="url(#sheet-play-cut)"/>
    </g>
  </defs>

  <rect width="1500" height="720" fill="#F5EFE4"/>
  <text x="70" y="66" fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ORBIT STAR × PLAY — FLAT STUDIES</text>
  <line x1="70" y1="98" x2="1430" y2="98" stroke="#CFC2AE"/>
  <line x1="500" y1="140" x2="500" y2="640" stroke="#CFC2AE"/>
  <line x1="1000" y1="140" x2="1000" y2="640" stroke="#CFC2AE"/>

  <g transform="translate(90 165)" color="#10100E">
    <text fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">A — PLAY ARM</text>
    <text y="30" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">Star and play become one shape</text>
    <use href="#play-hybrid" transform="translate(70 80) scale(2.25)"/>
    <use href="#play-hybrid" transform="translate(70 420) scale(.25)"/>
    <text x="122" y="442" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">32 px</text>
  </g>

  <g transform="translate(590 165)" color="#10100E">
    <text fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">B — STAR-CUT PLAY</text>
    <text y="30" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">Star removed from a play triangle</text>
    <use href="#star-cut-play" transform="translate(70 80) scale(2.25)"/>
    <use href="#star-cut-play" transform="translate(70 420) scale(.25)"/>
    <text x="122" y="442" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">32 px</text>
  </g>

  <g transform="translate(1090 165)" color="#10100E">
    <text fill="#10100E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">C — PLAY-CUT STAR</text>
    <text y="30" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">Play triangle inside the original star</text>
    <use href="#play-cut-star" transform="translate(70 80) scale(2.25)"/>
    <use href="#play-cut-star" transform="translate(70 420) scale(.25)"/>
    <text x="122" y="442" fill="#6F6558" font-family="Arial, Helvetica, sans-serif" font-size="14">32 px</text>
  </g>
</svg>
